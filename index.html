<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CampusConnect</h1>
        <p>Smart Student Academic Portal</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome, Student 👋</h2>
            <p>Manage your academic activities in one place.</p>
        </section>

        <section class="cards">
            <div class="card">
                <h3>06</h3>
                <p>Subjects</p>
            </div>

            <div class="card">
                <h3>04</h3>
                <p>Tasks Completed</p>
            </div>

            <div class="card">
                <h3>72%</h3>
                <p>Progress</p>
            </div>
        </section>

        <section class="activities">
            <h2>Today's Activities</h2>
            <p>✓ Complete FOSS Lab</p>
            <p>○ Submit Assignment</p>
            <p>○ Practice Java</p>
        </section>
    </main>

    <footer>
        <p>© 2026 CampusConnect | Student Portal</p>
    </footer>

</body>
</html>
